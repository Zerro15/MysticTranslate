name: Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK 36
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Test, lint and assemble
        run: bash gradlew :mystic:testDebugUnitTest :mystic:lintDebug :mystic:assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: MysticTranslate-debug
          path: mystic/build/outputs/apk/debug/mystic-debug.apk
          if-no-files-found: error
